# =====================================================================
# CI test stack (used by .github/workflows/ci.yml and deploy.yml):
#
#   docker compose -f docker-compose.test.yml run --rm test
#   docker compose -f docker-compose.test.yml down -v
#
# .env.test is gitignored, so every variable the suites need is set here.
# Integration globalSetup creates and migrates the hot + archive test
# databases itself, so Postgres starts empty.
# =====================================================================

# Own project name: without it this stack shares "order-service" with
# docker-compose.yml and reuses the dev containers/volumes.
name: order-service-test

services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Core-events consumer and outbound outbox tests talk to a real broker.
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  test:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
      # Keep the host's node_modules (other OS) out; npm ci fills this one.
      - /app/node_modules
    environment:
      NODE_ENV: test
      PORT: "4001"
      ACCESS_SECRET: test-access-secret
      REFRESH_SECRET: test-refresh-secret
      ACCESS_EXPIRES_IN: "3600"
      REFRESH_EXPIRES_IN: "86400"
      CORS_ORIGINS: http://localhost:3000

      # Single shard keeps the suite fast. Test DB names must end in `_test`.
      REGIONS: eg
      DB_POOL_MAX: "5"
      DB_MIGRATION_DIRECTORY: src/migrations
      DB_MIGRATION_EXTENSION: ts
      DB_eg_HOST: postgres
      DB_eg_PORT: "5432"
      DB_eg_USERNAME: postgres
      DB_eg_PASSWORD: postgres
      DB_eg_NAME: order_service_eg_test
      ARCHIVE_DB_eg_HOST: postgres
      ARCHIVE_DB_eg_PORT: "5432"
      ARCHIVE_DB_eg_USERNAME: postgres
      ARCHIVE_DB_eg_PASSWORD: postgres
      ARCHIVE_DB_eg_NAME: order_service_archive_eg_test

      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      # Tests FLUSHDB between cases and refuse DB 0.
      REDIS_DB: "15"

      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_CORE_EVENTS_EXCHANGE: core.events.test
      RABBITMQ_CORE_EVENTS_QUEUE: order-service.core-events.test
      RABBITMQ_CORE_EVENTS_BINDINGS: "product.#,branch.#,restaurant.#,rbac.#"
      RABBITMQ_CORE_EVENTS_DLX: core.events.dlx.test
      RABBITMQ_CORE_EVENTS_DLQ: order-service.core-events.dlq.test
      RABBITMQ_PREFETCH: "32"
      RABBITMQ_ORDER_EVENTS_EXCHANGE: order.events.test
      OUTBOUND_EVENTS_DRAIN_TICK_SEC: "2"
      OUTBOUND_EVENTS_BATCH_SIZE: "100"

      # core-service and Kashier are stand-in HTTP servers the integration
      # suite starts on these ports (tests/helpers/stubs).
      CORE_SERVICE_BASE_URL: http://127.0.0.1:4655
      CORE_INTERNAL_API_KEY: test-internal-key
      KASHIER_BASE_URL: http://127.0.0.1:4656
      KASHIER_FEP_BASE_URL: https://test-fep.kashier.io
      KASHIER_MERCHANT_ID: MID-TEST
      KASHIER_API_KEY: test-kashier-api-key
      KASHIER_SECRET_KEY: test-kashier-secret-key
      KASHIER_PAYMENT_TYPE: credit
      KASHIER_RETURN_URL: https://example.com/checkout/return
      KASHIER_FAIL_URL: https://example.com/checkout/failed
      KASHIER_WEBHOOK_URL: http://localhost:4001/api/payments/webhook/kashier?region=eg
      PAYMENT_SESSION_TIMEOUT_MIN: "15"
      ONLINE_PAYMENT_REGIONS: eg

      WS_HEARTBEAT_SEC: "30"
      PRESENCE_STALE_SEC: "300"
      ASSIGNMENT_TICK_SEC: "10"
      ASSIGNMENT_RADIUS_METERS: "5000"
      ASSIGNMENT_CANDIDATES: "5"
      ASSIGNMENT_OFFER_TTL_SEC: "30"
      ASSIGNMENT_CLAIM_TTL_SEC: "300"
      ASSIGNMENT_MAX_ATTEMPTS: "3"
      ASSIGNMENT_BATCH: "20"
      AGENT_EARNING_SHARE_BPS: "8000"

      ARCHIVAL_CRON: "0 3 * * *"
      ARCHIVAL_BATCH_SIZE: "1000"
      ARCHIVAL_MAX_RUNTIME_MIN: "60"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # Install deps, compile, then unit and integration suites (set -e: fail fast).
    # --maxWorkers=2: one ts-jest worker per core exhausts a small Docker VM
    # (e.g. Docker Desktop's 4 GB) and starves the real-timer tests.
    command: sh -e -c "npm ci && npm run build && npm test -- --maxWorkers=2 && npm run test:integration"
